
name: Short-Lived Cloud Credentials Validation

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate-credentials:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud using OIDC
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/183529796215/locations/global/workloadIdentityPools/short-lived-credential-pool/providers/github-oidc-provider
          service_account: short-lived-credential-validator@short-lived-cloud-credentials.iam.gserviceaccount.com

      - name: Verify temporary identity
        run: |
          echo "OIDC authentication step completed."
          echo "Credential validation workflow is running."
